<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NanoKVM test screen</title>
<style>body{margin:0;background:#131b29;color:#fff;font:24px system-ui;text-align:center}main{padding:24px}.bars{display:flex;height:180px}.bars div{flex:1}.red{background:#d51c32}.green{background:#1aaf56}.blue{background:#205ee7}button,input{font:inherit;padding:16px;margin:12px}#pad{border:4px solid white;padding:35px;cursor:crosshair}pre{white-space:pre-wrap;font:18px monospace}</style>
<main><h1>Dedicated console test</h1><p>Use only synthetic text in this window.</p><div class="bars"><div class="red"></div><div class="green"></div><div class="blue"></div></div>
<button id="full">Enter full screen</button><p id="clock"></p><input id="text" placeholder="Type kvmtest here" autocomplete="off" spellcheck="false" aria-label="Synthetic keyboard test"><div id="pad" tabindex="0">Mouse test area — click here</div><pre id="result"></pre></main>
<script>
'use strict';
const result=document.getElementById('result'),input=document.getElementById('text'),pad=document.getElementById('pad');
const state={keyPresses:0,keyReleases:0,clicks:0,x:null,y:null,active:true,heldKeys:[]};const held=new Set();
function render(){state.active=document.hasFocus();state.heldKeys=[...held];result.textContent=JSON.stringify({...state,text:input.value},null,2)}
input.addEventListener('keydown',e=>{state.keyPresses++;held.add(e.code);render()});input.addEventListener('keyup',e=>{state.keyReleases++;held.delete(e.code);render()});input.addEventListener('input',render);
pad.addEventListener('click',e=>{state.clicks++;state.x=e.clientX;state.y=e.clientY;render()});
document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen();
window.addEventListener('focus',render);window.addEventListener('blur',render);
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString();render()},250);render();
</script></html>
