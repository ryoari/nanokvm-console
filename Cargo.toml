[package]
name = "nanokvm-console"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Local NanoKVM console with Lean-checked input"

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
url = "2"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
fs2 = "0.4"
futures-util = "0.3"
native-tls = "0.2"
tokio-native-tls = "0.3"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.release]
strip = true
